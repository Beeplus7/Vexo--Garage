# Vexo Garage — host split (live on VPS /etc/nginx/sites-available/vexo-garage)
# app.vexogarage.co.uk  → main product host → 127.0.0.1:3001
# vexogarage.co.uk/www  → marketing pages   → 127.0.0.1:3001
# Do NOT touch VisaGuide :3000 or Shopfooty :4001

upstream vexo_web_upstream {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.vexogarage.co.uk vexogarage.co.uk www.vexogarage.co.uk;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.vexogarage.co.uk;
    large_client_header_buffers 4 32k;

    ssl_certificate /etc/letsencrypt/live/app.vexogarage.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.vexogarage.co.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    location / {
        proxy_pass http://vexo_web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # Supabase Auth sets large cookie headers on /auth/callback
        proxy_buffer_size 128k;
        proxy_buffers 8 128k;
        proxy_busy_buffers_size 256k;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vexogarage.co.uk www.vexogarage.co.uk;
    large_client_header_buffers 4 32k;

    ssl_certificate /etc/letsencrypt/live/vexogarage.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vexogarage.co.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://vexo_web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_buffer_size 128k;
        proxy_buffers 8 128k;
        proxy_busy_buffers_size 256k;
    }
}
