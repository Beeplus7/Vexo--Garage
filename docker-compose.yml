version: '3.8'
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  vexo-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - redis
      - minio
    restart: unless-stopped

  # Keyword Layer :4001 - Already LIVE in shopfooty-traffic v2.5 :4001 KEEP LIVE - Separate service
  keyword-layer:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "4001:4001"
    env_file:
      - .env
    environment:
      - PORT=4001
      - SERVICE=keyword-layer
    depends_on:
      - redis
    restart: unless-stopped
    # Already LIVE shopfooty-traffic.aroleadjo.com → 87.106.103.43 - SSL ACTIVE - KEEP LIVE

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - vexo-web
      - keyword-layer
    restart: unless-stopped

volumes:
  redis_data:
  minio_data: