events { worker_connections 1024; }
http {
  upstream vexo_web { server vexo-web:3000; }
  upstream keyword_layer { server keyword-layer:4001; }

  server {
    listen 80;
    server_name vexogarage.co.uk www.vexogarage.co.uk api.vexogarage.co.uk keyword.vexogarage.co.uk shopfooty-traffic.aroleadjo.com aroleadjo.com;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    server_name vexogarage.co.uk www.vexogarage.co.uk;
    ssl_certificate /etc/letsencrypt/live/vexogarage.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vexogarage.co.uk/privkey.pem;

    location / {
      proxy_pass http://vexo_web;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  server {
    listen 443 ssl;
    server_name api.vexogarage.co.uk;
    ssl_certificate /etc/letsencrypt/live/vexogarage.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vexogarage.co.uk/privkey.pem;

    location / {
      proxy_pass http://vexo_web;
      proxy_set_header Host $host;
    }
  }

  server {
    listen 443 ssl;
    server_name keyword.vexogarage.co.uk shopfooty-traffic.aroleadjo.com;
    ssl_certificate /etc/letsencrypt/live/vexogarage.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vexogarage.co.uk/privkey.pem;

    location / {
      proxy_pass http://keyword_layer;
      proxy_set_header Host $host;
    }
  }
}